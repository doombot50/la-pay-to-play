name: deploy-pages

# Build the static pay-to-play site and publish it to GitHub Pages.
# Data flow: pull the CF donations export (published by the la-campaign-finance
# repo) -> normalize -> ingest Act 87 contracts -> resolve/score -> build_site.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"        # Mondays 08:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt && pip install -e .

      # Never deploy from a broken tree.
      - run: pytest -q

      # Runners start empty; without a cache every weekly run re-downloads
      # years of PDFs from checkbook.la.gov. Keyed by month so the saved cache
      # rolls forward (the ingest itself always re-fetches the current and
      # previous month).
      - name: Compute cache key
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache Act 87 PDFs
        uses: actions/cache@v4
        with:
          path: data/raw/act87_pdfs
          key: act87-pdfs-${{ steps.month.outputs.month }}
          restore-keys: |
            act87-pdfs-

      # Donations: published by the CF repo as a release asset (the flat-file
      # handoff). Public asset, no auth needed.
      #
      # Three ways this handoff fails quietly, each guarded below:
      #   HTTP flake      -> curl retries, then fails the build (never a partial file)
      #   truncated .gz   -> gzip -t before we trust it
      #   stale asset     -> the producer's publish step is continue-on-error, so a
      #                      weeks-old asset stays downloadable and would ship as new;
      #                      Last-Modified is checked against MAX_AGE_DAYS.
      # Schema drift and an empty/zero-money export are caught in cf_import itself.
      - name: Fetch CF donations export
        env:
          CF_URL: https://github.com/doombot50/la-campaign-finance/releases/download/data-cache/cf_donations.csv.gz
          HDRS: ${{ runner.temp }}/cf_headers.txt
          MAX_AGE_DAYS: "14"      # producer republishes nightly
        run: |
          set -eo pipefail
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            -D "$HDRS" -o data/external/cf_donations.csv.gz "$CF_URL"
          gzip -t data/external/cf_donations.csv.gz
          python - <<'EOF'
          import datetime, email.utils, os, sys
          with open(os.environ["HDRS"], encoding="utf-8", errors="replace") as fh:
              hdrs = fh.read().splitlines()
          lines = [l for l in hdrs if l.lower().startswith("last-modified:")]
          if not lines:
              print("note: no Last-Modified header; skipping the staleness check")
              sys.exit(0)
          published = email.utils.parsedate_to_datetime(lines[-1].split(":", 1)[1].strip())
          age = (datetime.datetime.now(datetime.timezone.utc) - published).days
          print(f"cf_donations.csv.gz published {published.isoformat()} ({age} days old)")
          if age > int(os.environ["MAX_AGE_DAYS"]):
              sys.exit(f"refusing to build: CF donations export is {age} days old — the "
                       "upstream la-campaign-finance publish step is failing")
          EOF
          gunzip -f data/external/cf_donations.csv.gz
          python -m paytoplay.ingest.cf_import

      - name: Ingest Act 87 contracts
        run: python -m paytoplay.ingest.contracts_act87 --since 2022

      - name: Resolve, score, build site
        run: |
          python -m paytoplay.pipeline
          python -m paytoplay.build_site
          echo "p2p.charliestephens.xyz" > web/CNAME
          touch web/.nojekyll

      # A source-format change upstream (PDF layout, CSV columns) tends to fail
      # SILENTLY as an empty dataset. Refuse to publish a suspiciously small site.
      - name: Sanity-check the built site
        run: |
          python - <<'EOF'
          import json, sys
          meta = json.load(open("web/data/meta.json"))
          counts = meta["counts"]
          problems = []
          if counts["contracts_total"] < 5000:
              problems.append(f"only {counts['contracts_total']} contracts (expected >= 5000)")
          if counts["published_links"] < 1:
              problems.append("zero published links")
          if problems:
              sys.exit("refusing to deploy: " + "; ".join(problems))
          print(f"ok: {counts['contracts_total']} contracts, "
                f"{counts['published_links']} published links")
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
