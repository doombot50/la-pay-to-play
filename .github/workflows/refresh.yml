name: refresh

# Re-run scrape -> resolve -> score on a schedule and on demand.
# NOTE: ingest steps need real source access + the CF export; wire those up
# (artifacts, a committed export, or a secret-driven fetch) before enabling cron.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 7 * * 1"   # Mondays 07:00 UTC

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
